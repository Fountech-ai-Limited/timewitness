[package]
name = "timewitness-platform"
description = "The counters only the operating system can answer: how long the machine slept, and whether something else moved its clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
timewitness-core = { workspace = true }

# This is the one crate in the workspace that does not forbid unsafe code, and the lint table is
# written out here rather than inherited because that is the only way to say so. Everything else the
# workspace sets is repeated unchanged. Two calls into the operating system need it, both of them in
# `continuous.rs`, both reading a counter into a local and returning it, and the boundary test in the
# architecture crate fails if a second crate ever joins this one.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "warn"
