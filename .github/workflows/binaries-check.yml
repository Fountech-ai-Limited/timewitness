name: Binaries check

# Reads a release's binaries the way a stranger gets them and runs
# `scripts/the-binaries-are-signed.py` on each of the three systems, because each system's signature
# can only be checked on that system: `spctl` on macOS, `signtool` on Windows, and cosign for Linux,
# which every leg runs. Each leg also runs the binary built for it and holds `--version` to the tag.
#
# `release.yml` calls it once the assets are attached, and it can be run by hand on any release.
#
# Each macOS and Windows signature is held to our own identities, read from
# `scripts/signing-identities.json` in the commit this runs from, which is `main` when the release
# workflow calls it. While one of them is unset every leg fails, and says which.
#
# With `linux_only`, for a release that carries the Linux binaries alone, only the two Linux legs run,
# each with `--linux-only`: no identity is read, and nothing is said about macOS or Windows.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      linux_only:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to check'
        required: true
        type: string
      linux_only:
        description: 'The release carries the Linux binaries alone'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: check ${{ inputs.tag }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.linux_only && '["ubuntu-22.04", "ubuntu-22.04-arm"]' || '["ubuntu-22.04", "ubuntu-22.04-arm", "macos-15-intel", "macos-15", "windows-2022"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          LINUX_ONLY: ${{ inputs.linux_only }}
        run: |
          set -uo pipefail
          # Windows runners name it python, the others python3.
          py=python3
          if ! "$py" -c 'import sys' >/dev/null 2>&1; then py=python; fi
          "$py" scripts/the-binaries-are-signed.py --self-test || exit 1
          only=()
          if [ "$LINUX_ONLY" = true ]; then only=(--linux-only); fi
          "$py" scripts/the-binaries-are-signed.py --release "$TAG" "${only[@]}"
