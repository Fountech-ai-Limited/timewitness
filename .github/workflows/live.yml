name: Live

# The tests that talk to real time sources, run against them once a day.
#
# Every test that proves this product can reach a real Roughtime, NTP, NTS, drand or RFC 3161 server
# and that the answer verifies is marked ignored, because the ordinary build should not go red when
# somebody else's server does. Until 2026-09-21 nothing ran them, so a retired server, an expired
# certificate or a changed protocol would have reached a user before it reached a test.
#
# Once a day rather than on every push: a server's health is a question about the world rather than
# about a commit, and the surfaces workflow beside this one already runs on a clock for the same
# reason. The run takes about a minute. It also runs on a pull request that changes this file, so a
# change to it is watched working before it merges rather than after.
#
# It asks our own two Roughtime servers too, with the three command-line tests that need a server of
# ours. Until 2026-09-24 this comment and the README said none was deployed and the run skipped them,
# while both had answered since 2026-09-12 and the served key log had named both since 2026-09-15.
# So a stopped server of ours would have gone unnoticed. The servers are read out of the served key
# log at run time by `scripts/our-servers.py --list`, which is the same reader that holds every
# surface to that log, so a server added to it is asked the next morning and nothing here names one.
#
# It starts a fresh agent ten times from cold and times how soon `timewitness status` says how wrong
# the clock could be, from 2026-09-24. The README states that time, and a stated time is a claim
# about a machine that can reach the servers, which is this job and no other in this repository.
#
# It stamps through an agent of its own, from 2026-09-24, and checks the receipt verifies, that a
# second agent on the same endpoint refuses and leaves the first reachable, and that a stopped agent
# lets no stamp through. That is acceptance item A-10, and it needs a bound, so it needs the servers.
#
# It walks the quick start, from 2026-09-24. `scripts/walk-the-quick-start.py` reads the commands off
# `docs/quick-start.md` and runs them as written in a fresh Ubuntu container, with no Rust and nothing
# of ours in it, and the walk has to end in a receipt that verifies. Three more walks each change one
# command on the page and have to fail. That is acceptance item A-12, and the page stamps, so it
# needs the servers too.
#
# What it does not run: the printer in the clock crate, which asserts nothing.
#
# A failure is visible without a log: the badge in the README turns red, and the run's summary is a
# table naming each test and whether it answered.

on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/live.yml'
      - 'scripts/live-summary.sh'
      - 'scripts/our-servers.py'
      - 'scripts/status-from-cold.py'
      - 'scripts/a-stamp-through-the-agent.py'
      - 'scripts/walk-the-quick-start.py'
      - 'docs/quick-start.md'

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    name: the live integrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: The summary still names a failure
        run: bash scripts/live-summary.sh --self-test

      - name: Every source client against the real servers
        run: |
          set -o pipefail
          cargo test --locked -p timewitness-sources --tests -- --ignored --test-threads 1 2>&1 | tee "$RUNNER_TEMP/live.txt"
          status=$?
          bash scripts/live-summary.sh <"$RUNNER_TEMP/live.txt" >>"$GITHUB_STEP_SUMMARY"
          summary=$?
          [ "$status" -eq 0 ] && [ "$summary" -eq 0 ]

      # Our own servers, under the keys the served log names. It runs whatever the step above said,
      # because a public server being down says nothing about ours. The log is the served one rather
      # than the copy in this tree, since the served one is what a reader checks a receipt against.
      # Each test line is renamed with the address it asked, so the summary says which server failed
      # without anybody opening the log. The failures are collected rather than left to stop the
      # step, so the summary is written on the run that most needs it.
      - name: Our own Roughtime servers, under the keys the served log names
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/key-log.txt"
          out="$RUNNER_TEMP/ours.txt"
          if ! curl -fsS --max-time 30 https://timewitness.dev/key-log.txt -o "$log"; then
            echo "The served key log at timewitness.dev/key-log.txt could not be fetched, so none of our servers was asked." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          servers="$(python3 scripts/our-servers.py --list "$log")"
          if [ -z "$servers" ]; then
            echo "The served key log names no server of ours in use, so there is nothing to ask." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          status=0
          TIMEWITNESS_PROBE_KEY_LOG="$log" cargo test --locked -p timewitness-cli --test against_a_running_server -- --ignored --test-threads 1 every_server 2>&1 \
            | tee "$RUNNER_TEMP/one.txt" || status=1
          sed -E 's/^test ([^ ]+) \.\.\. /test \1, every server in the served key log ... /' "$RUNNER_TEMP/one.txt" >"$out"
          while read -r address key; do
            TIMEWITNESS_PROBE_ADDRESS="$address" TIMEWITNESS_PROBE_KEY="$key" cargo test --locked -p timewitness-cli --test against_a_running_server -- --ignored --test-threads 1 --skip every_server </dev/null 2>&1 \
              | tee "$RUNNER_TEMP/one.txt" || status=1
            sed -E "s/^test ([^ ]+) \.\.\. /test \1, against $address ... /" "$RUNNER_TEMP/one.txt" >>"$out"
          done <<<"$servers"
          printf '\n### Our own Roughtime servers\n\n' >>"$GITHUB_STEP_SUMMARY"
          bash scripts/live-summary.sh <"$out" >>"$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"

      # Ten cold starts of the agent, each asked every half second until `status` prints the width
      # and the plain sentence, and each stopped by the number it was started under. It fails if a
      # start takes longer than the time the README states, or if the README and the code state
      # different times. It runs whatever the steps above said, because it asks the same public
      # servers for a different reason. The self-test goes first, so a reader that no longer
      # recognises an answer is caught before it is trusted with ten.
      - name: A fresh agent says how wrong the clock could be within the stated time
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/status-from-cold.py --self-test
          cargo build --locked --release -p timewitness-cli
          status=0
          python3 scripts/status-from-cold.py --starts 10 >"$RUNNER_TEMP/cold.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/cold.txt"
          {
            printf '\n### A fresh agent, ten starts from cold\n\n```\n'
            tail -n 18 "$RUNNER_TEMP/cold.txt"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

      # One agent of its own, stamped through until a stamp is signed, then a second agent started on
      # the same endpoint file, then the first stopped and stamped through again. It fails if the
      # receipt does not verify as read from a resident agent, if the second agent starts or does not
      # say why in words, if the first is not still the one reached, or if a stopped agent lets a
      # stamp through. It needs the public servers for the same reason the step above does: a stamp
      # needs a bound.
      - name: A stamp through the agent verifies, a stopped one refuses, and a second leaves the first alone
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/a-stamp-through-the-agent.py --self-test
          cargo build --locked --release -p timewitness-cli
          status=0
          python3 scripts/a-stamp-through-the-agent.py >"$RUNNER_TEMP/through.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/through.txt"
          {
            printf '\n### A stamp through the agent\n\n```\n'
            cat "$RUNNER_TEMP/through.txt"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The quick start, walked as a newcomer would walk it. The runner is only the host: the walk runs in
  # a fresh Ubuntu container that starts with no Rust and nothing of ours, so what this runner has
  # installed cannot stand in for a step the page forgot. The self-test goes first and needs no
  # container.
  quick-start:
    name: the quick start, walked on a clean machine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: The walk still reads the page and its verdict
        run: python3 scripts/walk-the-quick-start.py --self-test

      - name: Every command on the quick start, in a fresh container, ends in a verified receipt
        run: |
          status=0
          python3 scripts/walk-the-quick-start.py >"$RUNNER_TEMP/walk.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/walk.txt"
          {
            printf '\n### The quick start, walked on a clean machine\n\n```\n'
            tail -n 3 "$RUNNER_TEMP/walk.txt"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The same walk with one command on the page changed, once per seed. Each has to fail, so a walk
  # that stopped reading the page, or stopped reading the verdict, turns this red.
  quick-start-seeds:
    name: the quick start with one command changed
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [the-release, the-cargo-path, the-subject-checked]
    steps:
      - uses: actions/checkout@v4

      - name: The walk refuses the page with one command changed
        run: |
          status=0
          python3 scripts/walk-the-quick-start.py --seed "${{ matrix.seed }}" >"$RUNNER_TEMP/seed.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/seed.txt"
          {
            printf '\n### The quick start with %s changed\n\n```\n' "${{ matrix.seed }}"
            tail -n 4 "$RUNNER_TEMP/seed.txt"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
